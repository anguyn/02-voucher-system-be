version: '3.8'

services:
  # Only Redis for local development
  # MongoDB uses Atlas (for transaction support)
  redis:
    image: redis:7-alpine
    container_name: voucher-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - voucher-network

volumes:
  redis_data:
    driver: local

networks:
  voucher-network:
    driver: bridge
